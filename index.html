<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Flash Game</title>

  <script src="ruffle/ruffle.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    #game {
      width: 100vw;
      height: 100vh;
    }

    /* IMPORTANT: force the actual Ruffle <canvas>/<object> to fill */
    #game > * {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
  </style>
</head>

<body>

<div id="game"></div>

<script>
window.addEventListener("load", () => {
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();

    const container = document.getElementById("game");
    container.appendChild(player);

    // Critical: force sizing AFTER attach
    player.style.width = "100%";
    player.style.height = "100%";
    player.style.display = "block";

    player.load("game.swf");

    // extra safety: resize on load
    window.addEventListener("resize", () => {
        player.style.width = container.clientWidth + "px";
        player.style.height = container.clientHeight + "px";
    });
});
</script>

</body>
</html>
